<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300"><defs><linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#001B3D;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#003366;stop-opacity:1"></stop></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"></feGaussianBlur></filter><linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"></stop></linearGradient><linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#FFA93B;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#FF7B1C;stop-opacity:1"></stop></linearGradient><style>      .icon {        stroke: url(#iconGradient);        stroke-width: 2.5;        fill: none;        stroke-linecap: round;        stroke-linejoin: round;        filter: url(#glow);      }      .connector {        stroke: url(#lineGradient);        stroke-width: 2;        fill: none;      }      .connector-dot {        fill: #FFA93B;        filter: url(#glow);      }      .label {        fill: #FFFFFF;        font-family: system-ui, -apple-system, sans-serif;        font-size: 20px;        text-anchor: middle;        opacity: 0.9;      }      @keyframes pulse {        0% { opacity: 0.7; }        50% { opacity: 1; }        100% { opacity: 0.7; }      }      @keyframes flow {        0% { stroke-dashoffset: 1000; }        100% { stroke-dashoffset: 0; }      }      .animate-pulse {        animation: pulse 2s infinite;      }      .flow-line {        stroke-dasharray: 1000;        stroke-dashoffset: 1000;        animation: flow 10s linear infinite;      }    </style></defs><rect width="100%" height="100%" fill="url(#bgGradient)"></rect><path d="M0 25 L1400 25 M0 75 L1400 75 M0 125 L1400 125 M0 175 L1400 175 M0 225 L1400 225 M0 275 L1400 275" stroke="#ffffff10" stroke-width="0.5"></path><g transform="translate(150,150)" class="animate-pulse"><path class="icon" d="M-40,-20 C-40,-31 40,-31 40,-20 L40,20 C40,31 -40,31 -40,20 Z"></path><path class="icon" d="M-40,-20 C-40,-9 40,-9 40,-20"></path><circle cx="0" cy="0" r="25" fill="#4A90E220"></circle></g><text class="label" x="150" y="90">Fetch contacts in</text><text class="label" x="150" y="115">100 at a time</text><g transform="translate(350,150)" class="animate-pulse"><circle cx="0" cy="0" r="25" fill="#4A90E220"></circle><path class="icon" d="M-15,-15 L15,15 M-15,-15 L-5,-25 L25,-5 L15,15"></path></g><text class="label" x="350" y="90">Save progress to</text><text class="label" x="350" y="115">checkpoint.json</text><g transform="translate(600,150)" class="animate-pulse"><circle cx="0" cy="0" r="25" fill="#4A90E220"></circle><circle class="icon" cx="0" cy="0" r="20"></circle><line class="icon" x1="14" y1="14" x2="25" y2="25"></line><path class="icon" d="M-7,-7 L7,7 M-7,7 L7,-7"></path></g><text class="label" x="600" y="90">Analyze website detection,</text><text class="label" x="600" y="115">page count</text><g transform="translate(850,150)" class="animate-pulse"><circle cx="0" cy="0" r="25" fill="#4A90E220"></circle><path class="icon" d="M-15,-20 L15,-20 L15,20 L-15,20 Z"></path><line class="icon" x1="-8" y1="-10" x2="8" y2="-10"></line><line class="icon" x1="-8" y1="0" x2="8" y2="0"></line><line class="icon" x1="-8" y1="10" x2="8" y2="10"></line></g><text class="label" x="850" y="90">Save Progress to</text><text class="label" x="850" y="115">before the batch</text><g transform="translate(1100,150)" class="animate-pulse"><circle cx="0" cy="0" r="25" fill="#4A90E220"></circle><rect class="icon" x="-25" y="-20" width="50" height="40" rx="3"></rect><path class="icon" d="M-15,-10 L0,0 L15,-10"></path><line class="icon" x1="-25" y1="-12" x2="25" y2="-12"></line></g><text class="label" x="1100" y="90">Update MAUTIC</text><text class="label" x="1100" y="115">contact records</text><g transform="translate(1300,150)" class="animate-pulse"><circle cx="0" cy="0" r="25" fill="#4A90E220"></circle><circle class="icon" cx="0" cy="0" r="20"></circle><line class="icon" x1="0" y1="0" x2="0" y2="-12"></line><line class="icon" x1="0" y1="0" x2="8" y2="8"></line></g><text class="label" x="1300" y="90">Pause for 5</text><text class="label" x="1300" y="115">next batch</text><g><path class="connector flow-line" d="M200,150 L310,150"></path><path class="connector flow-line" d="M390,150 L560,150"></path><path class="connector flow-line" d="M640,150 L810,150"></path><path class="connector flow-line" d="M890,150 L1060,150"></path><path class="connector flow-line" d="M1140,150 L1260,150"></path><circle class="connector-dot animate-pulse" cx="200" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="310" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="390" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="560" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="640" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="810" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="890" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="1060" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="1140" cy="150" r="4"></circle><circle class="connector-dot animate-pulse" cx="1260" cy="150" r="4"></circle></g></svg>