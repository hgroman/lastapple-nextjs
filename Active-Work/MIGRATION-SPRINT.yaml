# ============================================================
# PHASE 5: QUALITY GATE
# ============================================================
# Nothing goes live until it passes. This is not a formality.
# Every redirect, every image, every build artifact.
# ============================================================
phase_5:
  name: "Quality Gate"
  purpose: "Prove the site works. No deployment without evidence."
  depends_on: "phase_4"
  estimated_duration: "45 minutes"
  status: NOT_STARTED

  substeps:
    5.1_production_build:
      description: "Clean production build with zero errors and zero warnings"
      command: "npm run build"
      status: NOT_STARTED
      notes: "This is the final build before deployment. Must be clean."

    5.2_redirect_verification:
      description: "Verify all 45 redirects resolve correctly"
      action: "Cross-check REDIRECT-MAP.yaml against next.config.ts. Test a sample of old WordPress URLs."
      source: "docs/wordpress-audit/REDIRECT-MAP.yaml"
      status: NOT_STARTED

    5.3_lighthouse_audit:
      description: "Run Lighthouse on key pages"
      status: NOT_STARTED
      target_score: 90
      pages:
        - "/"
        - "/stream"
        - "/portfolio"
        - "/services/wordpress-maintenance"
        - "/solutions/ai-chatbot"
        - "/contact"

    5.4_link_audit:
      description: "Check for broken internal links across all pages"
      status: NOT_STARTED

    5.5_mobile_responsive_check:
      description: "Verify all new pages render correctly on mobile viewports"
      status: NOT_STARTED
      viewports:
        - "375px (iPhone SE)"
        - "390px (iPhone 14)"
        - "768px (iPad)"

    5.6_seo_verification:
      description: "Confirm meta tags, JSON-LD, sitemap, and robots.txt"
      status: NOT_STARTED
      checks:
        - "sitemap.xml includes all new /stream/ and /portfolio paths"
        - "robots.txt allows crawling"
        - "Each page has unique title and description"
        - "JSON-LD organization schema present"
        - "Open Graph tags on key pages"

    5.7_content_review:
      description: "Read through all migrated content for formatting artifacts"
      status: NOT_STARTED
      checks:
        - "No leftover HTML tags in MDX content"
        - "No Elementor shortcodes"
        - "No broken image references"
        - "No WordPress-specific class names"
        - "Code blocks render with syntax highlighting"

  success_criteria:
    - "npm run build: zero errors, zero warnings"
    - "45/45 redirects verified"
    - "Lighthouse performance > 90 on all tested pages"
    - "Zero broken internal links"
    - "Mobile rendering clean on all viewports"
    - "SEO infrastructure complete"
    - "No WordPress artifacts in content"

# ============================================================
# PHASE 6: DNS CUTOVER
# ============================================================
# This phase requires explicit operator approval at every step.
# It is irreversible in the sense that the world sees the change.
# Rollback plan documented.
# ============================================================
phase_6:
  name: "DNS Cutover"
  purpose: "Make it live. lastapple.com serves the Next.js site."
  depends_on: "phase_5"
  estimated_duration: "1 hour"
  status: NOT_STARTED
  requires_operator_approval: true

  substeps:
    6.1_vercel_preview:
      description: "Deploy preview build on Vercel and verify"
      status: NOT_STARTED
      notes: "Push to main triggers auto-deploy. Verify at preview URL before DNS change."

    6.2_old_site_archive:
      description: "Move current WordPress lastapple.com to old.lastapple.com"
      action: "Configure subdomain in Cloudflare + SiteGround. Add noindex meta to WordPress."
      status: NOT_STARTED
      requires_operator_approval: true

    6.3_dns_update:
      description: "Point lastapple.com DNS to Vercel"
      action: "Update A/CNAME records in Cloudflare to Vercel deployment"
      status: NOT_STARTED
      requires_operator_approval: true
      rollback: "Point DNS back to SiteGround IP. old.lastapple.com stays live as backup."

    6.4_ssl_verification:
      description: "Confirm HTTPS works on the new lastapple.com"
      status: NOT_STARTED

    6.5_propagation_check:
      description: "Verify DNS propagation (allow up to 48 hours)"
      status: NOT_STARTED

    6.6_gsc_notification:
      description: "Submit new sitemap to Google Search Console"
      action: "Property: lastapple.com. Submit sitemap.xml. Request re-index of key pages."
      status: NOT_STARTED

    6.7_smoke_test:
      description: "Full site walkthrough on production"
      status: NOT_STARTED
      checks:
        - "Homepage loads with real content"
        - "/stream shows all 14 posts"
        - "/portfolio shows real client gallery"
        - "All services and solutions render"
        - "Contact form submits"
        - "Redirects work from old URLs"
        - "Analytics tracking fires"

  success_criteria:
    - "lastapple.com serves Next.js site"
    - "old.lastapple.com serves WordPress archive with noindex"
    - "SSL valid"
    - "GSC notified with new sitemap"
    - "Smoke test passes"
    - "Rollback plan documented and tested"

  rollback_plan:
    trigger: "Critical rendering failure or data loss on production"
    steps:
      - "Revert Cloudflare DNS A/CNAME to SiteGround IP"
      - "Verify old.lastapple.com still serves WordPress"
      - "Swap old.lastapple.com back to lastapple.com"
    estimated_recovery: "15 minutes (DNS TTL dependent)"

