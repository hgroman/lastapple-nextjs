# ============================================================
# EARLY OBSERVATIONS — for the Phase 2 debate to chew on
# ============================================================

observations:

  - id: obs.1
    severity: high
    finding: "The brand voice in the skill file says 'workshop with sawdust on the floor' / anti-hype. The footer brand description says 'cutting-edge solutions with AI, automation, and modern web technologies' — directly contradicts the voice."

  - id: obs.2
    severity: high
    finding: "Hardcoded fallback hero copy ('Building an AI-Powered CRM Integration Today' + 2.4k/89%/12s stats) is currently visible because Stream is empty. These numbers may be invented — PROOF veto risk if any of them ship."

  - id: obs.3
    severity: medium
    finding: "Default site description: 'WordPress that actually works' has the same defensive flavor as 'Real Clients.' Protests too much. Same poison family."

  - id: obs.4
    severity: medium
    finding: "Footer CTA heading 'Ready to Build Something Amazing?' is generic filler. 'Something' and 'Amazing' carry zero meaning."

  - id: obs.5
    severity: medium
    finding: "Footer body 'a quick automation or a complete digital transformation' uses 'digital transformation' — a hype phrase that contradicts the workshop voice."

  - id: obs.6
    severity: medium
    finding: "Nav item description for WordPress Resurrection has a grammar bug: 'Revive and modernization aging sites' should be 'Revive and modernize aging sites.'"

  - id: obs.7
    severity: low
    finding: "Nav CTA 'Let's Talk' is generic but defensible. Flag for Phase 3 review against the disqualification principle — does it filter buyers or invite anyone?"

  - id: obs.8
    severity: low
    finding: "'Case Studies' nav item links to /clients which may not exist as a route. Verify before debate — broken link is its own message."
